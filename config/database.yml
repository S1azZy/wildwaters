default: &default
  adapter: postgis
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST", "127.0.0.1") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
  username: <%= ENV.fetch("DB_USER", "postgres") %>
  password: <%= ENV.fetch("DB_PASSWORD", "postgres") %>

development:
  <<: *default
  database: <%= ENV.fetch("DB_NAME", "wildwaters_development") %>

test:
  <<: *default
  database: <%= ENV.fetch("DB_TEST_NAME", "wildwaters_test") %>

production:
  primary: &primary_production
    <<: *default
    host: <%= ENV.fetch("DB_HOST", "db") %>
    database: <%= ENV.fetch("DB_NAME", "wildwaters_production") %>
    username: <%= ENV.fetch("DB_USER", "wildwaters") %>
    password: <%= ENV["WILDWATERS_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: <%= ENV.fetch("DB_CACHE_NAME", "wildwaters_production_cache") %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: <%= ENV.fetch("DB_QUEUE_NAME", "wildwaters_production_queue") %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: <%= ENV.fetch("DB_CABLE_NAME", "wildwaters_production_cable") %>
    migrations_paths: db/cable_migrate
